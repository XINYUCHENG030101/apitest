[pytest]
minversion = 8.0
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --alluredir=reports/allure-results
markers =
    smoke: 核心冒烟用例
    destructive: 会新增或修改服务端数据的用例
    db: 依赖数据库连接的校验用例
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore:Unverified HTTPS request:urllib3.exceptions.InsecureRequestWarning
